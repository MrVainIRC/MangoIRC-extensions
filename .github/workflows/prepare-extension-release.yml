name: Prepare extension release

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension folder in the repository root, for example DigitalTouch
        required: true
        type: string

      version:
        description: Release version without the v prefix, for example 0.1.0
        required: true
        type: string

      create_tag:
        description: Create or reuse the version tag
        required: true
        default: true
        type: boolean

      update_latest_tag:
        description: Update the extension-specific latest tag and release
        required: true
        default: true
        type: boolean

      create_release:
        description: Create GitHub Releases and attach the .grove package
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------

      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # -----------------------------------------------------------------------
      # Validation and metadata
      # -----------------------------------------------------------------------

      - name: Validate extension
        id: meta
        shell: bash
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if [[ "$EXTENSION" == *"/"* || "$EXTENSION" == "." || "$EXTENSION" == ".." ]]; then
            echo "Extension must be a repository-root folder."
            exit 1
          fi

          if [[ ! -d "$EXTENSION" ]]; then
            echo "Extension folder does not exist: $EXTENSION"
            exit 1
          fi

          if [[ ! -f "$EXTENSION/manifest.json" ]]; then
            echo "Missing $EXTENSION/manifest.json"
            exit 1
          fi

          MANIFEST_VERSION="$(jq -r '.version // empty' "$EXTENSION/manifest.json")"

          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match requested version ($VERSION)."
            exit 1
          fi

          if [[ "${{ inputs.create_release }}" == "true" ]]; then
            if [[ ! -f "$EXTENSION/RELEASE_NOTES.md" ]]; then
              echo "Missing $EXTENSION/RELEASE_NOTES.md"
              exit 1
            fi

            if [[ ! -s "$EXTENSION/RELEASE_NOTES.md" ]]; then
              echo "$EXTENSION/RELEASE_NOTES.md is empty"
              exit 1
            fi
          fi

          SLUG="$(printf '%s' "$EXTENSION" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"

          if [[ -z "$SLUG" ]]; then
            echo "Could not derive extension slug."
            exit 1
          fi

          BRANCH="release/$SLUG"
          TAG="$SLUG-v$VERSION"
          LATEST_TAG="$SLUG-latest"
          ASSET_NAME="${EXTENSION}-v${VERSION}.grove"

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Prepare release files before changing branches
      # -----------------------------------------------------------------------

      - name: Prepare release files
        shell: bash
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release"

          if [[ "${{ inputs.create_release }}" == "true" ]]; then
            cp \
              "$EXTENSION/RELEASE_NOTES.md" \
              "$RUNNER_TEMP/release/RELEASE_NOTES.md"
          fi

          (
            cd "$EXTENSION"

            zip -qr \
              "$RUNNER_TEMP/release/$ASSET_NAME" \
              .
          )

          echo "Created Grove package:"
          ls -lh "$RUNNER_TEMP/release/$ASSET_NAME"

      # -----------------------------------------------------------------------
      # Build/update extension-specific release branch
      #
      # The branch contains only the extension files.
      # Every extension release becomes exactly one commit.
      # Development commits from main are not imported.
      # -----------------------------------------------------------------------

      - name: Build release branch
        id: release_branch
        shell: bash
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/$EXTENSION"
          RELEASE_DIR="$(mktemp -d)"

          cp -a "$SOURCE_DIR/." "$RELEASE_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/$RELEASE_BRANCH" \
            >/dev/null 2>&1
          then
            echo "Existing release branch found: $RELEASE_BRANCH"

            git fetch \
              origin \
              "refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"

            git checkout \
              -B "$RELEASE_BRANCH" \
              "origin/$RELEASE_BRANCH"
          else
            echo "Creating initial release branch: $RELEASE_BRANCH"

            git checkout --orphan "$RELEASE_BRANCH"

            git rm -rf . >/dev/null 2>&1 || true
          fi

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            -not -name .git \
            -exec rm -rf {} +

          cp -a "$RELEASE_DIR/." .

          git add -A

          if git diff --cached --quiet; then
            echo "Release branch already contains identical extension files."
            echo "No new release commit required."
          else
            git commit \
              -m "$EXTENSION v$VERSION"

            git push \
              origin \
              "HEAD:refs/heads/$RELEASE_BRANCH"

            echo "Created release commit:"
            git log -1 --oneline
          fi

          RELEASE_COMMIT="$(git rev-parse HEAD)"
          RELEASE_TREE="$(git rev-parse HEAD^{tree})"

          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_tree=$RELEASE_TREE" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Permanent version tag
      #
      # Example:
      # digitaltouch-v0.1.1
      #
      # Version tags are immutable.
      # -----------------------------------------------------------------------

      - name: Create or reuse version tag
        if: ${{ inputs.create_tag }}
        id: version_tag
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ steps.release_branch.outputs.release_commit }}
          RELEASE_TREE: ${{ steps.release_branch.outputs.release_tree }}
        run: |
          set -euo pipefail

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/$TAG" \
            >/dev/null 2>&1
          then
            echo "Version tag already exists: $TAG"

            git fetch \
              --force \
              origin \
              "refs/tags/$TAG:refs/tags/$TAG"

            TAG_TREE="$(git rev-parse "$TAG^{tree}")"

            if [[ "$TAG_TREE" != "$RELEASE_TREE" ]]; then
              echo "Existing tag $TAG points to different release contents."
              echo "Version tags are immutable and will not be overwritten."
              exit 1
            fi

            echo "Existing version tag matches the current release contents."

            VERSION_COMMIT="$(git rev-list -n 1 "$TAG")"
          else
            git tag \
              -a "$TAG" \
              "$RELEASE_COMMIT" \
              -m "$EXTENSION v$VERSION"

            git push \
              origin \
              "refs/tags/$TAG"

            VERSION_COMMIT="$RELEASE_COMMIT"

            echo "Created version tag: $TAG"
          fi

          echo "version_commit=$VERSION_COMMIT" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Permanent version release
      #
      # Example:
      # DigitalTouch v0.1.1
      # Tag: digitaltouch-v0.1.1
      # Asset: DigitalTouch-v0.1.1.grove
      # -----------------------------------------------------------------------

      - name: Create version release
        if: ${{ inputs.create_release && inputs.create_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail

          ASSET="$RUNNER_TEMP/release/$ASSET_NAME"
          NOTES_FILE="$RUNNER_TEMP/release/RELEASE_NOTES.md"

          if [[ ! -f "$ASSET" ]]; then
            echo "Grove package not found: $ASSET"
            exit 1
          fi

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes not found: $NOTES_FILE"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version release already exists: $TAG"
            echo "Existing permanent release will not be modified."
          else
            gh release create "$TAG" "$ASSET" \
              --title "$EXTENSION v$VERSION" \
              --notes-file "$NOTES_FILE"

            echo "Created version release: $TAG"
          fi

      # -----------------------------------------------------------------------
      # Moving extension-specific latest tag
      #
      # Example:
      # digitaltouch-latest
      #
      # This always points to the newest release commit.
      # -----------------------------------------------------------------------

      - name: Update latest tag
        if: ${{ inputs.create_tag && inputs.update_latest_tag }}
        shell: bash
        env:
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          VERSION_COMMIT: ${{ steps.version_tag.outputs.version_commit }}
        run: |
          set -euo pipefail

          if [[ -z "$VERSION_COMMIT" ]]; then
            echo "Version commit is unavailable."
            exit 1
          fi

          git tag \
            -f "$LATEST_TAG" \
            "$VERSION_COMMIT"

          git push \
            --force \
            origin \
            "refs/tags/$LATEST_TAG"

          echo "Updated latest tag: $LATEST_TAG"

      # -----------------------------------------------------------------------
      # Moving extension-specific latest release
      #
      # Example:
      # DigitalTouch Latest — v0.1.1
      #
      # The previous latest release is removed and recreated using the
      # updated latest tag, current release notes and current Grove package.
      # -----------------------------------------------------------------------

      - name: Create latest release
        if: ${{ inputs.create_release && inputs.create_tag && inputs.update_latest_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
        run: |
          set -euo pipefail

          ASSET="$RUNNER_TEMP/release/$ASSET_NAME"
          NOTES_FILE="$RUNNER_TEMP/release/RELEASE_NOTES.md"

          if [[ ! -f "$ASSET" ]]; then
            echo "Grove package not found: $ASSET"
            exit 1
          fi

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes not found: $NOTES_FILE"
            exit 1
          fi

          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Removing previous latest release: $LATEST_TAG"

            gh release delete \
              "$LATEST_TAG" \
              --yes
          fi

          gh release create "$LATEST_TAG" "$ASSET" \
            --title "$EXTENSION Latest — v$VERSION" \
            --notes-file "$NOTES_FILE"

          echo "Created latest release: $LATEST_TAG"

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.meta.outputs.branch }}
          TAG: ${{ steps.meta.outputs.tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          ASSET_NAME: ${{ steps.meta.outputs.asset_name }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Extension release"
            echo
            echo "- Extension: \`$EXTENSION\`"
            echo "- Version: \`$VERSION\`"
            echo "- Source branch: \`$RELEASE_BRANCH\`"

            if [[ "${{ inputs.create_tag }}" == "true" ]]; then
              echo "- Version tag: \`$TAG\`"
            else
              echo "- Version tag: not created"
            fi

            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              echo "- Version release: \`$EXTENSION v$VERSION\`"
              echo "- Grove asset: \`$ASSET_NAME\`"
              echo "- Release notes: \`$EXTENSION/RELEASE_NOTES.md\`"
            else
              echo "- Version release: not created"
            fi

            if [[ "${{ inputs.update_latest_tag }}" == "true" ]]; then
              echo "- Latest tag: \`$LATEST_TAG\`"

              if [[ "${{ inputs.create_release }}" == "true" ]]; then
                echo "- Latest release: \`$EXTENSION Latest — v$VERSION\`"
              fi
            else
              echo "- Latest tag/release: not updated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
