name: Prepare extension release

on:
  workflow_dispatch:
    inputs:
      extension:
        description: Extension folder in the repository root, for example DigitalTouch
        required: true
        type: string

      version:
        description: Release version without the v prefix, for example 0.1.0
        required: true
        type: string

      create_tag:
        description: Create the version tag
        required: true
        default: true
        type: boolean

      update_latest_tag:
        description: Update the extension-specific latest tag
        required: true
        default: true
        type: boolean

      create_release:
        description: Create a GitHub Release and attach the .grove package
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate extension
        id: meta
        shell: bash
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if [[ "$EXTENSION" == *"/"* || "$EXTENSION" == "." || "$EXTENSION" == ".." ]]; then
            echo "Extension must be a repository-root folder."
            exit 1
          fi

          if [[ ! -d "$EXTENSION" ]]; then
            echo "Extension folder does not exist: $EXTENSION"
            exit 1
          fi

          if [[ ! -f "$EXTENSION/manifest.json" ]]; then
            echo "Missing $EXTENSION/manifest.json"
            exit 1
          fi

          MANIFEST_VERSION="$(jq -r '.version // empty' "$EXTENSION/manifest.json")"

          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match requested version ($VERSION)."
            exit 1
          fi

          if [[ "${{ inputs.create_release }}" == "true" ]]; then
            if [[ ! -f "$EXTENSION/RELEASE_NOTES.md" ]]; then
              echo "Missing $EXTENSION/RELEASE_NOTES.md"
              exit 1
            fi

            if [[ ! -s "$EXTENSION/RELEASE_NOTES.md" ]]; then
              echo "$EXTENSION/RELEASE_NOTES.md is empty"
              exit 1
            fi
          fi

          SLUG="$(printf '%s' "$EXTENSION" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"

          if [[ -z "$SLUG" ]]; then
            echo "Could not derive extension slug."
            exit 1
          fi

          BRANCH="release/$SLUG"
          TAG="$SLUG-v$VERSION"
          LATEST_TAG="$SLUG-latest"

          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        shell: bash
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release"

          if [[ "${{ inputs.create_release }}" == "true" ]]; then
            cp "$EXTENSION/RELEASE_NOTES.md" \
              "$RUNNER_TEMP/release/RELEASE_NOTES.md"
          fi

          (
            cd "$EXTENSION"
            zip -qr \
              "$RUNNER_TEMP/release/${EXTENSION}-${VERSION}.grove" \
              .
          )

          echo "Created Grove package:"
          ls -lh "$RUNNER_TEMP/release/${EXTENSION}-${VERSION}.grove"

      - name: Build release branch
        shell: bash
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ steps.meta.outputs.branch }}
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/$EXTENSION"
          RELEASE_DIR="$(mktemp -d)"

          cp -a "$SOURCE_DIR/." "$RELEASE_DIR/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan __extension_release__

          git rm -rf . >/dev/null 2>&1 || true

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            -not -name .git \
            -exec rm -rf {} +

          cp -a "$RELEASE_DIR/." .

          git add -A
          git commit -m "$EXTENSION v$VERSION"

          git branch -M "$RELEASE_BRANCH"

          git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Create version tag
        if: ${{ inputs.create_tag }}
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            echo "Existing version tags are never overwritten."
            exit 1
          fi

          git tag -a "$TAG" -m "$EXTENSION v$VERSION"
          git push origin "refs/tags/$TAG"

      - name: Update latest tag
        if: ${{ inputs.create_tag && inputs.update_latest_tag }}
        shell: bash
        env:
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
        run: |
          set -euo pipefail

          git tag -f "$LATEST_TAG"
          git push --force origin "refs/tags/$LATEST_TAG"

      - name: Create GitHub Release
        if: ${{ inputs.create_release && inputs.create_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          ASSET="$RUNNER_TEMP/release/${EXTENSION}-${VERSION}.grove"
          NOTES_FILE="$RUNNER_TEMP/release/RELEASE_NOTES.md"

          if [[ ! -f "$ASSET" ]]; then
            echo "Grove package not found: $ASSET"
            exit 1
          fi

          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Release notes not found: $NOTES_FILE"
            exit 1
          fi

          gh release create "$TAG" "$ASSET" \
            --title "$EXTENSION v$VERSION" \
            --notes-file "$NOTES_FILE"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.meta.outputs.branch }}
          TAG: ${{ steps.meta.outputs.tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Extension release"
            echo
            echo "- Extension: \`$EXTENSION\`"
            echo "- Version: \`$VERSION\`"
            echo "- Branch: \`$RELEASE_BRANCH\`"

            if [[ "${{ inputs.create_tag }}" == "true" ]]; then
              echo "- Version tag: \`$TAG\`"
            else
              echo "- Version tag: not created"
            fi

            if [[ "${{ inputs.update_latest_tag }}" == "true" ]]; then
              echo "- Latest tag: \`$LATEST_TAG\`"
            else
              echo "- Latest tag: not updated"
            fi

            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              echo "- Grove asset: \`${EXTENSION}-${VERSION}.grove\`"
              echo "- Release notes source: \`$EXTENSION/RELEASE_NOTES.md\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
